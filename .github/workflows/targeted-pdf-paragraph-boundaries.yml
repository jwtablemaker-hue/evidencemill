name: targeted PDF paragraph boundary tests

on:
  push:
    branches:
      - fix/pdf-paragraph-boundaries-20261104
    paths:
      - '.github/workflows/targeted-pdf-paragraph-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e '.[ocr,pdf]'
      - run: python -m unittest tests.test_pdf_ingest tests.test_document_pipeline tests.test_sentence_structure tests.test_worker
