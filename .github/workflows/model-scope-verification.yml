name: EvidenceMill model-scope verification
on:
  pull_request:
    paths:
      - 'src/evidencemill/**'
      - 'tests/test_document_pipeline.py'
      - 'tests/test_pdf_ingest.py'
      - '.github/workflows/model-scope-verification.yml'
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF/OCR test dependencies
        run: python -m pip install -e '.[pdf,ocr]'
      - name: Run affected EvidenceMill tests
        run: |
          PYTHONPATH=src python -m unittest -v \
            tests.test_pdf_ingest \
            tests.test_document_pipeline
