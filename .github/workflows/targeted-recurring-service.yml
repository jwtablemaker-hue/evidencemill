name: targeted recurring service semantic tests

on:
  push:
    branches:
      - fix/recurring-service-instruction-20261104
    paths:
      - '.github/workflows/targeted-recurring-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install EvidenceMill
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run targeted tests
        run: python -m unittest tests.test_sentence_structure tests.test_worker
