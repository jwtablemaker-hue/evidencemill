name: targeted direct service instruction tests

on:
  push:
    branches:
      - fix/direct-service-instructions-20261104
    paths:
      - '.github/workflows/targeted-direct-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m unittest tests.test_sentence_structure tests.test_worker
